name: global_articles_service
description: >
  LibreECAD globaler Artikel-Dienst (M1.2) — ein logisch globaler,
  lesbarer Artikelstamm (Allgemein / Hersteller je Hersteller /
  User-Uploads) mit Testdaten. Kein Upload in M1.
publish_to: none
environment:
  sdk: ^3.9.0

dependencies:
  ecad_core:
    path: ../ecad_core
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  postgres: ^3.5.6
  shared_server_kit:
    path: ../shared_server_kit

dev_dependencies:
  test: ^1.26.2
  http: ^1.5.0
