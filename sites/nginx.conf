server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location /assets/ { expires 1h; }
    location /downloads/ { expires -1; }
}
