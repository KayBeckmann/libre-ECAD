server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-store"; }
  location /api/company/internal/ { return 404; }
  location /api/company/ { proxy_pass http://company-users-service:8083/; }
  location /api/global/ { proxy_pass http://global-articles-service:8082/; }
  location /api/superadmin/ { proxy_pass http://super-admin-service:8081/; }
}
