resolver 127.0.0.11 valid=10s ipv6=off;
upstream company_backend { zone company_backend 64k; server company-users-service:8083 resolve; }
upstream global_backend { zone global_backend 64k; server global-articles-service:8082 resolve; }
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-store"; }
  location /api/company/internal/ { return 404; }
  location /api/company/ { proxy_pass http://company_backend/; }
  location /api/global/internal/ { return 404; }
  location /api/global/ { proxy_pass http://global_backend/; }
  location /api/superadmin/ { return 404; }
}
