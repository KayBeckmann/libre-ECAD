resolver 127.0.0.11 valid=10s ipv6=off;
upstream operator_backend { zone operator_backend 64k; server super-admin-service:8081 resolve; }
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "no-store" always;
  location / { try_files $uri $uri/ /index.html; }
  location = /api/operator { proxy_pass http://operator_backend/operator; }
  location /api/auth/ { proxy_pass http://operator_backend/auth/; }
}
